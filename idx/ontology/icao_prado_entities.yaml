comment: Issuing-state and holder-nationality codes from ICAO Doc 9303 Part 3 (ISO 3166-1 alpha-3 plus
  ICAO exceptional codes). PRADO uses the same three-letter issuing-state codes. Canonical labels are
  ALL CAPS (ETH / ETHIOPIA / ETHIOPIAN). Knowing any of code, country_name, or nationality resolves the
  other two. That is canonicalisation of ONE printed fact — it is not permission to copy issuing country
  onto nationality or the reverse (a Belgian permit stating ETH is the proof).
