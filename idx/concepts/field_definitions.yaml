# Field profiles — the extraction engine does not change when a new
# country or card generation appears. This file grows: aliases, types,
# validators. See docs/FIELD_ONTOLOGY.md.
#
# Bilingual labels are stored AS PRINTED on the card (pipe or slash
# between languages). You do not need a per-language YAML file to add
# an Ethiopian Digital ID line like "ሙሉ ስም | Full Name"; ontology.py
# expands each delimiter-separated form into its components at load.
#
# Every alias here is either already in concepts/labels/*.yaml or was
# read off a real specimen in this project's corpus (Italian CIE,
# Ontario DL, UK provisional DL, Washington/California DL, Dutch ID,
# Belgian residence permit, Ethiopian Digital ID generations, Ethiopian
# DL, Ethiopian passport). Do not add a guessed translation.

